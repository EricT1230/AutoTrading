apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: autotrading-dev

resources:
  - ../../base

nameSuffix: -dev

commonLabels:
  environment: development

patches:
  # Reduce replicas for dev
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: frontend
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: backend
  # Reduce HPA for dev
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
    target:
      kind: HorizontalPodAutoscaler
  # Reduce resources for dev
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 64Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 128Mi
    target:
      kind: Deployment
      name: frontend
  # Use smaller storage for dev
  - patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 1Gi
    target:
      kind: StatefulSet

configMapGenerator:
  - name: autotrading-config
    behavior: merge
    literals:
      - log-level=DEBUG
      - trading-mode=paper

images:
  - name: autotrading/frontend
    newTag: dev
  - name: autotrading/backend
    newTag: dev
  - name: autotrading/trading-bot
    newTag: dev
