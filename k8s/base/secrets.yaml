apiVersion: v1
kind: Secret
metadata:
  name: autotrading-secrets
  namespace: autotrading
  labels:
    app.kubernetes.io/name: autotrading
    app.kubernetes.io/part-of: autotrading-system
type: Opaque
stringData:
  # Database credentials (replace with actual values)
  postgres-user: "autotrading"
  postgres-password: "CHANGE_ME_IN_PRODUCTION"
  database-url: "postgresql://autotrading:CHANGE_ME_IN_PRODUCTION@postgresql:5432/autotrading"

  # Redis URL
  redis-url: "redis://redis:6379/0"

  # OKX API credentials (replace with actual values)
  okx-api-key: "YOUR_OKX_API_KEY"
  okx-secret-key: "YOUR_OKX_SECRET_KEY"
  okx-passphrase: "YOUR_OKX_PASSPHRASE"
