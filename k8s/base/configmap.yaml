apiVersion: v1
kind: ConfigMap
metadata:
  name: autotrading-config
  namespace: autotrading
  labels:
    app.kubernetes.io/name: autotrading
    app.kubernetes.io/part-of: autotrading-system
data:
  # API URLs
  api-url: "http://backend:8000"
  ws-url: "ws://backend:8000/ws"

  # Database
  postgres-db: "autotrading"

  # Application settings
  log-level: "INFO"
  trading-mode: "paper"

  # Redis
  redis-host: "redis"
  redis-port: "6379"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-bot-config
  namespace: autotrading
  labels:
    app.kubernetes.io/name: trading-bot
    app.kubernetes.io/part-of: autotrading-system
data:
  config.yaml: |
    trading:
      symbol: BTC/USDT
      timeframe: 5m
      risk_per_trade: 0.01
      max_positions: 3
      max_daily_loss: 0.05

    strategy:
      name: ICT_NY_FVG
      parameters:
        fvg_threshold: 0.001
        session_start: "08:00"
        session_end: "12:00"
        min_fvg_size: 10

    exchange:
      name: OKX
      testnet: true
