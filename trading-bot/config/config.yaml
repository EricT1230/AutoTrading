# 全域交易設定
trading:
  symbol: "BTCUSDT"
  timeframe: "5m"
  risk_per_trade: 0.01  # 1% 風險
  max_positions: 1
  max_daily_loss: 0.05  # 5% 每日最大虧損
  
# 策略參數
strategy:
  name: "ICT_NY_FVG"
  parameters:
    # NY Session 設定
    session_start: "09:30"  # EST
    session_end: "11:30"    # EST
    timezone: "America/New_York"
    
    # FVG 設定
    min_fvg_size_pips: 10
    max_fvg_size_pips: 100
    fvg_timeout_bars: 10
    
    # Liquidity Sweep 設定
    lookback_bars: 5
    sweep_confirmation_bars: 1
    
    # 風險設定
    risk_reward_ratio: 3.0  # 1:3
    stop_loss_buffer_pips: 2
    take_profit_buffer_pips: 1

# 交易所設定
exchange:
  primary: "binance"
  testnet: true
  rate_limit: 1200  # requests per minute
  
# 回測設定
backtest:
  start_date: "2023-01-01"
  end_date: "2024-01-01"
  initial_capital: 10000
  commission: 0.001  # 0.1%
  slippage: 0.0001   # 0.01%

# 通知設定
notifications:
  enabled: true
  channels:
    telegram: true
    discord: false
    email: false
  
  events:
    trade_opened: true
    trade_closed: true
    error_occurred: true
    daily_summary: true

# 日誌設定
logging:
  level: "INFO"
  rotation: "10 MB"
  retention: "30 days"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {module}:{line} | {message}"

# 資料庫設定
database:
  type: "sqlite"
  path: "trading_bot.db"
  
# 系統設定
system:
  update_interval: 30  # 秒
  health_check_interval: 300  # 秒
  max_retries: 3
  retry_delay: 5  # 秒